async function tokenFor(who){state.tokens=state.tokens||{};if(state.tokens[who])return state.tokens[who];if(who==='hr'){const e=new Error(t('hrLoginNeeded'));e.code='HR_LOGIN';throw e;}const r=await fetch('api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'employee',employee_id:who.split(':')[1]})});if(!r.ok)throw new Error(t('error')+' ('+r.status+')');const d=await r.json();state.tokens[who]=d.token;return d.token;}
async function api(path,{role,method='GET',body,signal,timeout=45000,retried=false}={}){
 const controller=new AbortController();let timedOut=false;const abort=()=>controller.abort();if(signal?.aborted)controller.abort();else signal?.addEventListener('abort',abort,{once:true});
 const timer=setTimeout(()=>{timedOut=true;controller.abort();},timeout);
 const who=role||(state.view==='hr'?'hr':'employee:'+state.id);try{const headers={'Authorization':'Bearer '+await tokenFor(who)};if(body&&!(body instanceof FormData))headers['Content-Type']='application/json';
 const response=await fetch(path,{method,headers,body:body instanceof FormData?body:body?JSON.stringify(body):undefined,signal:controller.signal});
 if(response.status===401){delete state.tokens[who];if(who==='hr'){state.needHr=true;const e=new Error(t('hrLoginNeeded'));e.code='HR_LOGIN';throw e;}if(!retried)return await api(path,{role,method,body,signal,timeout,retried:true});}const raw=await response.text();let data;try{data=raw?JSON.parse(raw):{};}catch{throw new Error(t('error')+' ('+response.status+')');}
 if(!response.ok)throw new Error(response.status===403?t('forbidden'):plain(data.detail||data.error)||t('error')+' ('+response.status+')');return data;
 }catch(error){if(timedOut)throw new Error(t('timeout'));if(error.name==='AbortError')throw error;if(error instanceof TypeError)throw new Error(t('networkError'));throw error;}
 finally{clearTimeout(timer);signal?.removeEventListener('abort',abort);}
}
function syncLabels(){document.documentElement.lang=state.lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-placeholder]').forEach(el=>el.placeholder=t(el.dataset.placeholder));document.querySelectorAll('[data-lang]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.lang===state.lang)));$('employee-picker').hidden=state.view==='hr';$('directory-error').innerHTML=state.directoryError&&state.view==='employee'?alertBox(t('directoryError'),'error'):'';$('dataset-meta').textContent=state.meta?.as_of?t('asOf',{date:date(state.meta.as_of)}):'';}
function fillEmployees(){const q=$('employee-search').value.trim().toLowerCase();const employees=state.employees.length?state.employees:[{employee_id:state.id}];const matches=employees.filter(e=>[e.employee_id,e.full_name,e.role,e.grade].join(' ').toLowerCase().includes(q));const current=employees.find(e=>e.employee_id===state.id)||{employee_id:state.id};const rows=matches.some(e=>e.employee_id===state.id)?matches:[current,...matches];$('employee-select').innerHTML=rows.map(e=>'<option value="'+esc(e.employee_id)+'">'+esc([e.full_name||e.employee_id,e.full_name?e.employee_id:'',e.grade].filter(Boolean).join(' · '))+'</option>').join('')+(!matches.length?'<option disabled>'+esc(t('noMatches'))+'</option>':'');$('employee-select').value=state.id;}
async function loadDirectory(){try{state.employees=await api('api/employees');state.directoryError=false;fillEmployees();}catch{state.directoryError=true;}syncLabels();}
async function loadMeta(){try{state.meta=await api('api/meta',{role:state.view==='hr'?'hr':'employee:'+state.id});syncLabels();}catch{/* Metadata is optional to the primary flow. */}}
async function loadView(){state.controller?.abort();state.controller=new AbortController();const version=++state.version;state.loading=true;state.error=null;state.recommending=false;state.profile=null;state.hr=null;state.rec=null;state.path=null;state.mentors=null;state.wallet=null;state.garden=null;state.chat=[];state.chatBusy=false;state.hidden.clear();$('flash').innerHTML='';if(state.view==='hr'&&!(state.tokens&&state.tokens.hr)){state.needHr=true;state.loading=false;render();return;}render();try{const data=await api(state.view==='hr'?hrUrl():'api/employees/'+encodeURIComponent(state.id),{signal:state.controller.signal});if(version!==state.version)return;if(state.view==='hr')state.hr=data;else{state.profile=data;loadWallet();if(state.ai)api('api/employees/'+encodeURIComponent(state.id)+'/recommend?ai=true',{method:'POST'}).catch(()=>{});}}catch(error){if(version!==state.version||error.name==='AbortError')return;state.error=error.message;}finally{if(version===state.version){state.loading=false;render();}}}
function skillRows(p,other=false){const required=p.target?.required||{};const levels=p.effective_skills||p.employee?.skills||{};const critical=new Set(p.target?.critical||[]);const gaps=new Map((p.gaps||[]).map(g=>[g.skill_id,g]));return [...new Set([...Object.keys(required),...Object.keys(levels)])].filter(id=>other?!Object.hasOwn(required,id):Object.hasOwn(required,id)).sort((a,b)=>Number(critical.has(b))-Number(critical.has(a))).map(id=>{const current=number(levels[id]);const req=number(required[id]);const isCritical=(critical.has(id)||gaps.get(id)?.critical)&&current<req;const max=req||5;return '<div class="skill '+(isCritical?'critical':'')+'"><div class="skill-line"><span class="name">'+esc(skillName(id))+(isCritical?' <span class="pill critical">'+esc(t('critical'))+'</span>':'')+'</span><span class="levels">'+current+' / '+max+'</span></div><div class="track" role="meter" aria-label="'+esc(skillName(id))+'" aria-valuemin="0" aria-valuemax="'+Math.max(max,current)+'" aria-valuenow="'+current+'" aria-valuetext="'+esc(current+' / '+max)+'"><span style="width:'+pct(current/max*100)+'%"></span></div></div>';}).join('');}
function uncovered(gaps){return gaps?.length?alertBox(t('uncovered',{skills:gaps.map(g=>skillName(g.skill_id||g)).join(', ')})) : '';}
function renderEmployee(){const p=state.profile,e=p.employee||{},target=p.target||{},completed=p.completed||[],goal=e.career_goal&&typeof e.career_goal==='object'?[e.career_goal.target_role,e.career_goal.target_grade].filter(Boolean).join(' · '):e.career_goal;return '<div class="page-heading"><div><p class="eyebrow">'+esc(t('yourGrowth'))+'</p><h1>'+esc(e.full_name||e.employee_id||state.id)+'</h1><p class="muted small">'+esc([e.role,e.grade,t('tenure',{n:number(e.tenure_months)})].filter(Boolean).join(' · '))+'</p></div><span class="pill neutral">'+esc(e.employee_id||state.id)+'</span></div><div class="employee-grid"><aside class="panel" aria-label="'+esc(t('path',{grade:target.grade||t('development')}))+'"><h2>'+esc(t('path',{grade:target.grade||t('development')}))+'</h2><p class="muted small">'+esc(target.role||t('noTarget'))+'</p>'+(goal?'<p class="meta">'+esc(t('careerGoal'))+': '+esc(goal)+'</p>':'')+'<div class="readiness"><div class="readiness-line"><span class="small">'+esc(t('readiness'))+'</span><strong>'+Math.round(pct(p.readiness))+'%</strong></div><div class="track" role="progressbar" aria-label="'+esc(t('readiness'))+'" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct(p.readiness)+'"><span style="width:'+pct(p.readiness)+'%"></span></div>'+(p.readiness_breakdown?'<details class="calc"><summary>'+esc(t('howCalc'))+'</summary><p class="small">'+esc(t('calcFormula'))+'</p><p class="calc-line">'+number(p.readiness_breakdown.counted)+' / '+number(p.readiness_breakdown.required)+' = <strong>'+number(p.readiness_breakdown.pct)+'%</strong></p>'+(p.readiness_breakdown.missing.length?'<p class="small">'+esc(t('calcMissing'))+'</p><ul class="calc-list">'+p.readiness_breakdown.missing.map(x=>'<li>'+esc(skillName(x.skill_id))+(x.critical?' <span class="pill critical">'+esc(t('critical'))+'</span>':'')+'<span class="meta"> '+x.level+' → '+x.required+' · +'+x.missing+'</span></li>').join('')+'</ul>':'')+'</details>':'')+'</div><p class="meta">'+esc(t('currentRequired'))+'</p>'+skillRows(p)+(Object.keys(p.effective_skills||e.skills||{}).some(id=>!Object.hasOwn(target.required||{},id))?'<details><summary>'+esc(t('otherSkills'))+'</summary><p class="meta">'+esc(t('skillScale'))+'</p>'+skillRows(p,true)+'</details>':'')+(p.applied_after_review?.length?alertBox(t('updated')+' · '+p.applied_after_review.length,'success'):'')+'<p class="meta">'+esc(t('review'))+': '+esc(date(e.last_review_date))+'</p><details><summary>'+esc(t('completedActivities'))+' <span class="pill neutral">'+completed.length+'</span></summary>'+(completed.length?'<ul class="history">'+[...completed].sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(row=>'<li><span aria-hidden="true" style="color:var(--green)">✓ </span>'+esc(row.title||row.event_title||state.events[row.event_id]?.title||row.event_id)+'<time>'+esc(date(row.date))+'</time></li>').join('')+'</ul>':'<p class="muted small">'+esc(t('noCompleted'))+'</p>')+'</details>'+'<details open><summary>'+esc(t('availableSteps'))+' <span class="pill neutral">'+(p.eligible_steps||[]).length+'</span></summary>'+((p.eligible_steps||[]).length?'<ul class="history">'+p.eligible_steps.map(x=>'<li>'+esc(x.title)+'<span class="meta"> · '+esc(label('format',x.format))+(x.next_session?' · '+esc(date(x.next_session)):'')+(x.gains||[]).filter(g=>g.to>g.from).map(g=>' · +'+(g.to-g.from)+' '+esc(skillName(g.skill_id))).join('')+'</span></li>').join('')+'</ul>':'<p class="muted small">'+esc(t('noAvailable'))+'</p>')+'</details></aside><section class="panel"><div class="section-head"><div><h2>'+esc(t('nextSteps'))+'</h2><p class="muted small">'+esc(t('nextDescription'))+'</p></div><div class="actions"><label class="toggle"><input id="use-ai" type="checkbox" '+(state.ai?'checked ':'')+(state.recommending||state.mutating?'disabled':'')+'>'+esc(t('useAI'))+'</label><button class="primary" data-action="recommend" '+(state.recommending||state.mutating?'disabled':'')+'>'+esc(t(state.rec?'refreshRecommendations':'recommend'))+'</button></div></div><div id="recommendation-content">'+renderRecommendations()+'</div><p class="meta" style="margin-top:18px">'+esc(t('languageNote'))+' · '+esc(t('eligible',{n:(p.eligible_steps||[]).length}))+'</p></section></div>'+renderChat()+renderGarden()+renderWallet()+renderPath()+renderMentors();}
function renderPath(){const p=state.path;let body;if(state.pathLoading)body='<p class="muted small" role="status">'+esc(t('pathLoading'))+'</p>';else if(!p)body='<p class="muted small">'+esc(t('pathHint'))+'</p>';else if(!p.steps.length)body='<p class="muted small">'+esc(t('pathNone'))+'</p>';else body='<p class="path-summary"><strong>'+Math.round(p.readiness_now)+'% → '+Math.round(p.readiness_after)+'%</strong> '+esc(t('pathBy',{date:date(p.estimated_by)}))+'</p><ol class="path-list">'+p.steps.map(s=>'<li><span class="path-title">'+esc(s.title)+(s.critical_met?' <span class="pill">'+esc(t('pathCritical'))+'</span>':'')+'</span><span class="path-pct">'+Math.round(s.readiness_after)+'%</span><span class="meta">'+esc(label('format',s.format))+(s.date?' · '+esc(date(s.date))+' · <a href="api/events/'+encodeURIComponent(s.event_id)+'/ics?date='+encodeURIComponent(s.date)+'" download>📅 '+esc(t('addCal'))+'</a>':'')+'</span></li>').join('')+'</ol>'+(p.remaining_gaps.length?'<p class="meta">'+esc(t('pathRemaining',{n:p.remaining_gaps.length}))+'</p>':'');return '<section class="panel path-panel"><div class="path-head"><div><h2>'+esc(t('pathTitle',{grade:(p&&p.target&&p.target.grade)||(state.profile&&state.profile.target&&state.profile.target.grade)||''}))+'</h2><p class="muted small">'+esc(t('pathSub'))+'</p></div><button class="button-quiet" data-action="path" '+(state.pathLoading||state.mutating?'disabled':'')+'>'+esc(t('pathBtn'))+'</button></div>'+body+'</section>';}
function renderMentors(){const m=state.mentors;let body;if(state.mentorsLoading)body='<p class="muted small" role="status">'+esc(t('pathLoading'))+'</p>';else if(!m)body='<p class="muted small">'+esc(t('mentorHint'))+'</p>';else if(!m.mentors.length)body='<p class="muted small">'+esc(t('mentorNone'))+'</p>';else body='<ul class="mentor-list">'+m.mentors.map(x=>'<li><div class="mentor-avatar" aria-hidden="true">'+esc((x.full_name||'?').split(' ').map(w=>w[0]).join('').slice(0,2))+'</div><div><strong>'+esc(x.full_name)+'</strong><p class="meta">'+esc(x.role)+' · '+esc(x.grade)+'</p><p class="small">'+esc(t('mentorFor',{skill:x.skill}))+(x.no_course_available?' <span class="pill">'+esc(t('mentorNoCourse'))+'</span>':'')+'</p></div></li>').join('')+'</ul><p class="meta">'+esc(t('mentorPrivacy'))+'</p>';return '<section class="panel path-panel"><div class="path-head"><div><h2>'+esc(t('mentorTitle'))+'</h2><p class="muted small">'+esc(t('mentorSub'))+'</p></div><button class="button-quiet" data-action="mentors" '+(state.mentorsLoading?'disabled':'')+'>'+esc(t('mentorBtn'))+'</button></div>'+body+'</section>';}
async function loadMentors(){if(state.mentorsLoading||!state.profile)return;const version=state.version;state.mentorsLoading=true;render();try{const r=await api('api/employees/'+encodeURIComponent(state.id)+'/mentors');if(version===state.version)state.mentors=r;}catch(error){if(version===state.version)flash(error.message,'error');}finally{if(version===state.version){state.mentorsLoading=false;render();}}}
function renderChat(){const msgs=state.chat||[];return '<section class="panel path-panel chat-panel"><div class="path-head"><div><h2>'+esc(t('chatTitle'))+'</h2><p class="muted small">'+esc(t('chatSub'))+'</p></div></div>'+'<div class="chat-log" id="chat-log" aria-live="polite">'+(msgs.length?msgs.map(m=>'<div class="msg '+m.role+'"><div class="bubble">'+(m.role==='assistant'?md(m.content):esc(m.content))+'</div>'+(m.tools&&m.tools.length?'<div class="tools">'+esc(t('chatTools'))+': '+m.tools.map(x=>'<span class="pill neutral">'+esc(x.tool)+'</span>').join(' ')+(m.latency?' <span class="meta">'+number(m.latency).toFixed(1)+' s</span>':'')+'</div>':'')+'</div>').join(''):'<div class="chat-examples">'+[t('chatEx1'),t('chatEx2'),t('chatEx3')].map(q=>'<button class="button-quiet" data-action="ask" data-q="'+esc(q)+'">'+esc(q)+'</button>').join('')+'</div>')+(state.chatBusy?'<div class="msg assistant"><div class="bubble"><span class="spinner" aria-hidden="true"></span> '+esc(t('chatThinking'))+'</div></div>':'')+'</div>'+'<form id="chat-form" class="chat-form"><label for="chat-input" class="visually-hidden">'+esc(t('chatTitle'))+'</label><input id="chat-input" autocomplete="off" maxlength="1000" placeholder="'+esc(t('chatPlaceholder'))+'" '+(state.chatBusy?'disabled':'')+'><button class="primary" '+(state.chatBusy?'disabled':'')+'>'+esc(t('chatSend'))+'</button></form></section>';}
function md(text){return esc(text).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');}
async function dismiss(eventId,reason){if(state.mutating)return;lockControls(true);try{await api('api/employees/'+encodeURIComponent(state.id)+'/feedback',{method:'POST',body:{event_id:eventId,reason}});state.hidden.add(eventId);state.askReason=null;state.path=null;flash(t('reasonSaved'));state.profile=await api('api/employees/'+encodeURIComponent(state.id));}catch(error){flash(error.message,'error');}finally{lockControls(false);render();}}
async function ask(q){q=(q||'').trim();if(!q||state.chatBusy)return;const version=state.version;const history=state.chat.map(m=>({role:m.role,content:m.content}));state.chat.push({role:'user',content:q});state.chatBusy=true;render();try{const r=await api('api/employees/'+encodeURIComponent(state.id)+'/chat',{method:'POST',body:{message:q,history}});if(version!==state.version)return;state.chat.push({role:'assistant',content:r.answer,tools:r.tools_used,latency:r.latency_s});}catch(error){if(version===state.version)state.chat.push({role:'assistant',content:error.message});}finally{if(version===state.version){state.chatBusy=false;render();const log=$('chat-log');if(log)log.scrollTop=log.scrollHeight;$('chat-input')?.focus();}}}
function renderGarden(){const g=state.garden;if(!g)return '';const L=g.level,span=L.next_at?Math.round(100*(L.points-L.floor)/(L.next_at-L.floor)):100;return '<section class="panel path-panel garden-panel"><div class="path-head"><div><h2>'+esc(t('gardenTitle'))+'</h2><p class="muted small">'+esc(t('gardenSub'))+'</p></div>'+'<div class="level-box"><strong>'+esc(t('levelN',{n:L.level}))+' · '+esc(t('lvl_'+L.title.replace(/ /g,'_')))+'</strong><div class="track"><span style="width:'+span+'%"></span></div><span class="meta">'+(L.next_at?esc(t('toNext',{n:L.next_at-L.points})):esc(t('maxLevel')))+'</span></div></div>'+'<p class="small">'+esc(t('gardenGrown',{n:g.grown,total:g.total}))+'</p><div class="garden">'+g.plants.map(pl=>'<figure class="plant'+(pl.grown?' grown':'')+(pl.critical?' crit':'')+'"><img src="static/garden/stage'+pl.stage+'.png" alt="'+esc(skillName(pl.skill_id))+': '+pl.stage+'/5" loading="lazy"><figcaption><span>'+esc(pl.skill||skillName(pl.skill_id))+'</span><span class="meta">'+pl.stage+' / '+pl.target+(pl.grown?' ✓':'')+(pl.critical?' · '+esc(t('critical')):'')+'</span></figcaption></figure>').join('')+'</div>'+'<div class="share-row"><label><input type="checkbox" id="share-garden" '+(g.shared?'checked':'')+'> '+esc(t('shareGarden'))+'</label><span class="meta">'+esc(t('shareHint'))+'</span></div>'+(g.shared?(g.neighbours.length?'<ul class="neighbours">'+g.neighbours.map(n=>'<li><strong>'+esc(n.full_name)+'</strong> <span class="meta">'+esc(n.role)+' · '+esc(t('lvl_'+n.level.replace(/ /g,'_')))+' · '+esc(t('blooming',{n:n.blooming,total:n.plants}))+'</span></li>').join('')+'</ul>':'<p class="muted small">'+esc(t('noNeighbours'))+'</p>'):'')+'</section>';}
async function toggleShare(on){try{await api('api/employees/'+encodeURIComponent(state.id)+'/share',{method:'POST',body:{on}});await loadWallet();}catch(error){flash(error.message,'error');}}
function renderWallet(){const w=state.wallet;if(!w)return '';const o=w.challenge_offer,active=(w.challenges||[]).filter(c=>c.status==='active'),done=(w.challenges||[]).filter(c=>c.status==='completed');return '<section class="panel path-panel"><div class="path-head"><div><h2>'+esc(t('walletTitle'))+'</h2><p class="muted small">'+esc(t('walletRules',{a:w.rules.per_activity,l:w.rules.per_level,c:w.rules.challenge_bonus}))+'</p></div><div class="wallet-balance"><strong>'+number(w.balance)+'</strong><span class="meta">'+esc(t('points'))+'</span></div></div>'+'<div class="wallet-grid"><div><h3 class="small">'+esc(t('challengeTitle'))+'</h3>'+(active.length?active.map(c=>'<div class="challenge active"><strong>'+esc(t('challengeText',{skill:c.skill,level:c.target_level,date:c.by?date(c.by):'—'}))+'</strong><p class="meta">'+esc(t('challengeActive',{bonus:c.bonus}))+'</p></div>').join(''):'')+done.map(c=>'<div class="challenge done"><strong>✓ '+esc(t('challengeText',{skill:c.skill,level:c.target_level,date:c.by?date(c.by):'—'}))+'</strong><p class="meta">+'+number(c.bonus)+' '+esc(t('points'))+'</p></div>').join('')+(o?'<div class="challenge"><strong>'+esc(t('challengeText',{skill:o.skill,level:o.target_level,date:o.by?date(o.by):'—'}))+'</strong><p class="meta">'+esc(t('challengeOffer',{bonus:o.bonus,current:o.current}))+'</p><button class="button-quiet" data-action="challenge">'+esc(t('challengeAccept'))+'</button></div>':(active.length||done.length?'':'<p class="muted small">'+esc(t('challengeNone'))+'</p>'))+'</div><div><h3 class="small">'+esc(t('rewardsTitle'))+'</h3><ul class="rewards">'+w.rewards.map(r=>'<li><span>'+esc(r.title)+'</span><span class="meta">'+number(r.cost)+' '+esc(t('points'))+'</span><button class="button-quiet" data-action="redeem" data-id="'+esc(r.reward_id)+'" '+(r.affordable&&!state.mutating?'':'disabled')+'>'+esc(t('redeem'))+'</button></li>').join('')+'</ul></div></div>'+'<p class="meta">'+esc(t('walletPrivacy'))+'</p></section>';}
async function loadWallet(){if(!state.id||state.view==='hr')return;const version=state.version;try{const [w,g]=await Promise.all([api('api/employees/'+encodeURIComponent(state.id)+'/wallet'),api('api/employees/'+encodeURIComponent(state.id)+'/garden')]);if(version===state.version){state.wallet=w;state.garden=g;render();}}catch(error){if(version===state.version)flash(error.message,'error');}}
async function walletAction(path,body){if(state.mutating)return;lockControls(true);render();try{await api('api/employees/'+encodeURIComponent(state.id)+path,{method:'POST',body});flash(t(path==='/redeem'?'redeemed':'challengeAccepted'));await loadWallet();}catch(error){flash(error.message,'error');}finally{lockControls(false);render();}}
async function loadPath(){if(state.pathLoading||!state.profile)return;const version=state.version;state.pathLoading=true;render();try{const r=await api('api/employees/'+encodeURIComponent(state.id)+'/path');if(version===state.version)state.path=r;}catch(error){if(version===state.version)flash(error.message,'error');}finally{if(version===state.version){state.pathLoading=false;render();}}}
function renderRecommendations(){if(state.recommending)return '<div class="loading-card" role="status"><span class="spinner" aria-hidden="true"></span><h3>'+esc(t('generating'))+'</h3><p class="muted small">'+esc(t('generatingHint'))+'</p></div>';const r=state.rec;if(!r)return empty(t('getStarted'),t('getStartedHint'),'↗')+uncovered(state.profile?.uncovered_gaps);const steps=(r.steps||[]).filter(s=>!state.hidden.has(s.event_id));return '<div class="rec-meta"><span class="pill">'+esc(r.mode==='ai'?t('ai')+(r.model?' · '+r.model:''):t('rules'))+'</span>'+(r.upgrading?'<span class="meta"><span class="spinner small-spin" aria-hidden="true"></span> '+esc(t('aiUpgrading'))+'</span>':'')+(r.latency_s!=null?'<span class="meta">'+esc(t('latency',{seconds:number(r.latency_s).toFixed(1)}))+'</span>':'')+'</div>'+(r.summary?'<p class="summary" lang="'+esc(recLanguage())+'">'+esc(plain(r.summary))+'</p>':'')+'<div class="recommendations">'+(steps.length?steps.map(renderStep).join(''):empty(t('noSteps'),t((r.steps||[]).length?'hiddenSteps':'noStepsHint')))+'</div>'+(r.why_not&&plain(r.why_not)?'<div class="notice info"><strong>'+esc(t('whyNot'))+'</strong><p lang="'+esc(recLanguage())+'" style="white-space:pre-line;margin:6px 0 0">'+esc(plain(r.why_not))+'</p></div>':'')+uncovered(r.uncovered_gaps||state.profile?.uncovered_gaps);}
function renderStep(s){const f=s.factors||{},reliability=f.format_reliability;const gains=s.gains||[];const chips=[];if(f.closes_critical_gap)chips.push('<span class="pill critical">'+esc(t('criticalGap'))+'</span>');if(s.unlocks)chips.push('<span class="pill unlock">🔓 '+esc(t('unlocks',{title:s.unlocks.title}))+'</span>');gains.forEach(g=>chips.push('<span class="pill">'+esc(t('gain',{n:Math.max(0,number(g.to)-number(g.from)),skill:skillName(g.skill_id)}))+'</span>'));if(reliability&&typeof reliability==='object'&&(number(reliability.completed)+number(reliability.skipped))>0)chips.push('<span class="pill">'+esc(t('reliability',{done:number(reliability.completed),total:number(reliability.completed)+number(reliability.skipped),format:label('format',s.format)}))+'</span>');if(number(f.similar_skips)>0)chips.push('<span class="pill amber">'+esc(t('similarSkips',{n:f.similar_skips}))+'</span>');return '<article class="step"><div class="step-top"><div class="step-icon" aria-hidden="true">'+(s.type==='mentoring'?'◎':s.type==='workshop'?'◇':'↗')+'</div><div class="step-body"><p class="meta">'+esc(label('type',s.type))+'</p><h3>'+esc(s.title||s.event_id)+'</h3><div class="step-meta"><span>'+esc(label('format',s.format))+'</span>'+(s.duration_hours!=null?'<span>'+esc(t('hours',{n:s.duration_hours}))+'</span>':'')+'<span>'+esc(t('nextSession'))+': '+esc(s.next_session?date(s.next_session):t('unscheduled'))+'</span></div></div></div><div class="chips">'+chips.join('')+'</div><p class="rationale" lang="'+esc(recLanguage())+'">'+esc(plain(s.rationale))+'</p><div class="factors">'+(s.factors_used||[]).map(factor=>'<span class="factor">'+esc(typeof factor==='string'?label('factor',factor):plain(factor))+'</span>').join('')+'</div><div class="actions"><button class="primary" data-action="complete" data-id="'+esc(s.event_id)+'" '+(state.mutating?'disabled':'')+'>✓ '+esc(t(state.mutating?'saving':'done'))+'</button><button class="button-quiet" data-action="hide" data-id="'+esc(s.event_id)+'" '+(state.mutating?'disabled':'')+'>'+esc(t('notNow'))+'</button>'+(s.next_session?'<a class="button-quiet cal-link" href="api/events/'+encodeURIComponent(s.event_id)+'/ics?date='+encodeURIComponent(s.next_session)+'" download>📅 '+esc(t('addCal'))+'</a>':'')+'</div>'+(state.askReason===s.event_id?'<div class="reasons" role="group" aria-label="'+esc(t('whyNotNow'))+'"><span class="small">'+esc(t('whyNotNow'))+'</span>'+['format','time','not_interested'].map(r=>'<button class="button-quiet" data-action="dismiss" data-id="'+esc(s.event_id)+'" data-reason="'+r+'">'+esc(t('reason_'+r))+'</button>').join('')+'<button class="button-quiet" data-action="cancel-reason">'+esc(t('cancel'))+'</button></div>':'')+'</article>';}
function renderDraft(){const d=state.draft;if(!d)return '';return '<form id="draft-form" class="draft"><h3>'+esc(t('newActivity'))+' · '+esc(skillName(d.develops_skills[0].skill_id))+'</h3><p class="muted small">'+esc(t('draftHint',{n:d.blocked_employees}))+'</p>'+'<div class="draft-grid"><label>'+esc(t('draftTitle'))+'<input id="d-title" value="'+esc(d.title)+'" required></label>'+'<label>'+esc(t('formatLabel'))+'<select id="d-format">'+['online','offline','self_paced'].map(f=>'<option value="'+f+'"'+(d.format===f?' selected':'')+'>'+esc(label('format',f))+'</option>').join('')+'</select></label>'+'<label>'+esc(t('hoursLabel'))+'<input id="d-hours" type="number" min="1" max="80" value="'+number(d.duration_hours)+'"></label>'+'<label>'+esc(t('sessionLabel'))+'<input id="d-date" type="date" value="'+esc(d.upcoming_sessions[0]||'')+'"></label></div>'+'<p class="meta">'+esc(t('draftAudience',{roles:d.target_roles.join(', '),grades:d.target_grades.join(', '),level:d.develops_skills[0].max_level}))+'</p>'+'<div class="actions"><button class="primary">'+esc(t('publishActivity'))+'</button><button type="button" class="button-quiet" data-action="cancel-draft">'+esc(t('cancel'))+'</button></div></form>';}
async function loadDraft(skill){try{state.draft=await api('api/hr/event-draft?skill_id='+encodeURIComponent(skill),{role:'hr'});render();document.getElementById('d-title')?.focus();}catch(error){flash(error.message,'error');}}
async function publishDraft(){const d=state.draft;if(!d||state.mutating)return;const fmt=$('d-format').value,date=$('d-date').value;const spec={...d,title:$('d-title').value.trim()||d.title,format:fmt,duration_hours:Number($('d-hours').value)||d.duration_hours,upcoming_sessions:fmt==='self_paced'||!date?[]:[date]};delete spec.blocked_employees;lockControls(true);try{const r=await api('api/hr/events',{role:'hr',method:'POST',body:spec});state.draft=null;flash(t('activityCreated',{title:r.title,n:r.now_recommendable_for}));state.hr=await api(hrUrl(),{role:'hr'});}catch(error){flash(error.message,'error');}finally{lockControls(false);render();}}
function hrUrl(){return 'api/hr/summary'+(state.dept?'?department='+encodeURIComponent(state.dept):'');}
function renderHR(){const h=state.hr,lag=h.lagging_skills||[],blocked=h.no_recommended_step||[],participation=h.participation||[],top=[...lag].sort((a,b)=>number(b.employees)-number(a.employees))[0];const statuses=['completed','no_show','declined','dropped','overdue','in_progress'];const max=Math.max(1,...lag.map(s=>number(s.employees)));return '<div class="page-heading"><div><p class="eyebrow">'+esc(t('hrEyebrow'))+'</p><h1>'+esc(t('hrTitle'))+'</h1><p class="muted small">'+esc(t('hrSubtitle'))+'</p></div><div class="dept-filter"><label for="dept-filter" class="small">'+esc(t('department'))+'</label><select id="dept-filter"><option value="">'+esc(t('allDepartments'))+'</option>'+(h.departments||[]).map(d=>'<option value="'+esc(d)+'"'+(state.dept===d?' selected':'')+'>'+esc(d)+'</option>').join('')+'</select></div></div><div class="kpis"><div class="panel kpi"><div class="kpi-icon" aria-hidden="true">◎</div><div><strong>'+number(h.employees)+'</strong><p>'+esc(t('employees'))+'</p></div></div><div class="panel kpi"><div class="kpi-icon" style="background:#fff3d6;color:var(--amber)" aria-hidden="true">↗</div><div><strong>'+blocked.length+'</strong><p>'+esc(t('noRecommended'))+'</p></div></div><div class="panel kpi"><div class="kpi-icon" aria-hidden="true">▥</div><div><strong class="skill-kpi">'+esc(top?.name||skillName(top?.skill_id)||'—')+'</strong><p>'+esc(t('topLagging'))+'</p></div></div></div><div class="hr-grid"><section class="panel"><h2>'+esc(t('laggingSkills'))+'</h2><p class="muted small">'+esc(t('peopleBelow'))+'</p>'+(lag.length?'<div class="chart">'+lag.map(s=>'<div class="chart-line"><span>'+esc(s.name||skillName(s.skill_id))+'</span><div class="track" aria-hidden="true"><span style="width:'+pct(number(s.employees)/max*100)+'%"></span></div><strong>'+number(s.employees)+'</strong></div>').join('')+'</div>':empty(t('noGaps')))+'</section><section class="panel"><h2>'+esc(t('noRecommended'))+'</h2>'+(blocked.length?'<div class="scroll-table"><table><caption class="visually-hidden">'+esc(t('noRecommended'))+'</caption><thead><tr>'+['employeeId','role','grade','target','reason'].map(key=>'<th scope="col">'+esc(t(key))+'</th>').join('')+'</tr></thead><tbody>'+blocked.map(e=>'<tr><td>'+esc(e.employee_id)+'</td><td>'+esc(e.role)+'</td><td>'+esc(e.grade)+'</td><td>'+esc(typeof e.target==='object'?[e.target?.role,e.target?.grade].filter(Boolean).join(' · '):e.target||t('noTarget'))+'</td><td>'+esc(e.top_exclusion?t('r_'+String(e.top_exclusion).replace(/^prerequisite.*/,'prerequisite')):t('unknown'))+'</td></tr>').join('')+'</tbody></table></div>':empty(t('noBlocked'),'','✓'))+'</section></div>'+'<section class="panel" style="margin-top:24px"><h2>'+esc(t('catalogGaps'))+'</h2><p class="muted small">'+esc(t('catalogGapsHint'))+'</p>'+((h.catalog_gaps||[]).length?'<div class="scroll-table"><table><thead><tr><th scope="col">'+esc(t('skill'))+'</th><th scope="col">'+esc(t('peopleNeeding'))+'</th><th scope="col">'+esc(t('criticalFor'))+'</th><th scope="col"><span class="visually-hidden">'+esc(t('createActivity'))+'</span></th></tr></thead><tbody>'+h.catalog_gaps.map(g=>'<tr><td>'+esc(g.name||skillName(g.skill_id))+'</td><td>'+number(g.employees)+'</td><td>'+(g.critical_for?'<span class="pill critical">'+number(g.critical_for)+'</span>':'0')+'</td><td><button class="button-quiet" data-action="draft" data-id="'+esc(g.skill_id)+'">+ '+esc(t('createActivity'))+'</button></td></tr>').join('')+'</tbody></table></div>':empty(t('noCatalogGaps'),'','✓'))+renderDraft()+'</section>'+'<section class="panel"><h2>'+esc(t('participation'))+'</h2><p class="muted small">'+esc(t('participationHint'))+'</p>'+(participation.length?'<div class="scroll-table"><table><caption class="visually-hidden">'+esc(t('participation'))+'</caption><thead><tr><th scope="col">'+esc(t('activity'))+'</th>'+statuses.map(s=>'<th scope="col">'+esc(t(s))+'</th>').join('')+'</tr></thead><tbody>'+participation.map(e=>'<tr><td class="event">'+esc(e.title||e.event_id)+'<small>'+esc(e.event_id)+'</small></td>'+statuses.map(s=>'<td><span class="count '+s+'">'+number(e[s])+'</span></td>').join('')+'</tr>').join('')+'</tbody></table></div>':empty(t('noParticipation')))+'</section><section class="panel upload"><h2>'+esc(t('uploadTitle'))+'</h2><p class="muted small">'+esc(t('uploadHint'))+'</p><form id="upload-form"><div class="upload-fields"><div class="field"><label for="employees-file">'+esc(t('employeeFile'))+'</label><input id="employees-file" name="employees" type="file" accept=".json,application/json"></div><div class="field"><label for="history-file">'+esc(t('historyFile'))+'</label><input id="history-file" name="history" type="file" accept=".csv,text/csv"></div><button type="submit" class="primary">'+esc(t('upload'))+'</button></div><div id="upload-status" role="status" aria-live="polite"></div></form></section>';}
function render(){syncLabels();$('content').setAttribute('aria-busy',String(state.loading));if(state.loading){$('content').innerHTML=loading(t(state.view==='hr'?'loadHR':'loadProfile'));return;}if(state.error){$('content').innerHTML=alertBox(state.error,'error')+'<button data-action="retry">'+esc(t('retry'))+'</button>';return;}$('content').innerHTML=state.view==='hr'?(state.needHr?renderHrLogin():renderHR()):renderEmployee();}
function renderHrLogin(){return '<section class="panel login-panel"><h1>'+esc(t('hrLoginTitle'))+'</h1><p class="muted small">'+esc(t('hrLoginHint'))+'</p><form id="hr-login" class="chat-form"><label for="hr-password" class="visually-hidden">'+esc(t('hrPassword'))+'</label><input id="hr-password" type="password" autocomplete="current-password" placeholder="'+esc(t('hrPassword'))+'" required><button class="primary">'+esc(t('hrLoginBtn'))+'</button></form><div id="hr-login-status"></div></section>';}
async function hrLogin(pw){try{const r=await fetch('api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'hr',password:pw})});if(!r.ok){$('hr-login-status').innerHTML=alertBox(t('hrLoginWrong'),'error');return;}const d=await r.json();state.tokens=state.tokens||{};state.tokens.hr=d.token;state.needHr=false;loadView();}catch(error){$('hr-login-status').innerHTML=alertBox(error.message,'error');}}
function lockControls(locked){state.mutating=locked;['view','employee-search','employee-select'].forEach(id=>$(id).disabled=locked);document.querySelectorAll('[data-lang]').forEach(el=>el.disabled=locked);}
async function recommend(){if(state.recommending||state.mutating||!state.profile)return;const version=state.version;const base='api/employees/'+encodeURIComponent(state.id)+'/recommend';state.recommending=true;$('flash').innerHTML='';render();try{const quick=await api(base+'?ai=false',{method:'POST',signal:state.controller.signal});if(version!==state.version)return;state.rec={...quick,upgrading:state.ai};state.hidden.clear();state.recommending=false;render();if(state.ai){const rec=await api(base+'?ai=true',{method:'POST',signal:state.controller.signal});if(version===state.version&&state.rec&&state.rec.upgrading){state.rec=rec;}}}catch(error){if(version===state.version&&error.name!=='AbortError')flash(error.message,'error');if(state.rec)state.rec.upgrading=false;}finally{if(version===state.version){state.recommending=false;render();}}}
async function complete(eventId){if(state.mutating||!state.rec?.steps?.some(s=>s.event_id===eventId))return;lockControls(true);render();let saved=false;try{const result=await api('api/employees/'+encodeURIComponent(state.id)+'/complete',{method:'POST',body:{event_id:eventId}});saved=true;state.rec=null;state.path=null;state.hidden.clear();const pts=(result.points||[]).reduce((a,x)=>a+number(x.points),0);flash(t('completion',{before:Math.round(pct(result.readiness_before)),after:Math.round(pct(result.readiness_after))})+(pts?' · '+t('pointsEarned',{n:pts}):''));state.profile=await api('api/employees/'+encodeURIComponent(state.id));loadWallet();}catch(error){if(saved){state.error=t('refreshFailed');}else flash(error.message,'error');}finally{lockControls(false);render();}}
async function upload(form){if(state.mutating)return;const data=new FormData();for(const key of ['employees','history']){const file=form.elements[key].files[0];if(file)data.append(key,file);}if(![...data.keys()].length){$('upload-status').innerHTML=alertBox(t('chooseFile'),'error');return;}lockControls(true);form.querySelectorAll('input,button').forEach(el=>el.disabled=true);const button=form.querySelector('button');button.textContent=t('uploading');let saved=false;try{const result=await api('api/data/upload',{role:'hr',method:'POST',body:data});saved=true;const message=t('uploaded',{employees:Array.isArray(result.added_employees)?result.added_employees.length:number(result.added_employees),history:number(result.added_history)});state.hr=await api(hrUrl(),{role:'hr'});await Promise.all([loadDirectory(),loadMeta()]);flash(message);lockControls(false);render();}catch(error){$('upload-status').innerHTML=alertBox(saved?t('uploadRefreshFailed'):error.message,saved?'info':'error');}finally{lockControls(false);if(form.isConnected){form.querySelectorAll('input,button').forEach(el=>el.disabled=false);button.textContent=t('upload');if(saved)form.reset();}}}
$('view').addEventListener('change',e=>{state.view=e.target.value;loadView();});$('employee-search').addEventListener('input',fillEmployees);$('employee-select').addEventListener('change',e=>{state.id=e.target.value;loadView();});
document.querySelectorAll('[data-lang]').forEach(el=>el.addEventListener('click',()=>{if(state.mutating)return;state.lang=el.dataset.lang;render();fillEmployees();}));
$('content').addEventListener('change',e=>{if(e.target.id==='use-ai')state.ai=e.target.checked;if(e.target.id==='dept-filter'){state.dept=e.target.value;loadView();}if(e.target.id==='share-garden')toggleShare(e.target.checked);});
$('content').addEventListener('click',e=>{const button=e.target.closest('button[data-action]');if(!button||button.disabled)return;const action=button.dataset.action;if(action==='retry')loadView();if(action==='recommend')recommend();if(action==='path')loadPath();if(action==='mentors')loadMentors();if(action==='draft')loadDraft(button.dataset.id);if(action==='cancel-draft'){state.draft=null;render();}if(action==='ask')ask(button.dataset.q);if(action==='challenge')walletAction('/challenge');if(action==='redeem')walletAction('/redeem',{reward_id:button.dataset.id});if(action==='complete')complete(button.dataset.id);if(action==='cancel-reason'){state.askReason=null;render();}if(action==='dismiss')dismiss(button.dataset.id,button.dataset.reason);if(action==='hide'){state.askReason=button.dataset.id;render();return;}if(false){const next=$('content').querySelector('[data-action="complete"]')||$('content').querySelector('[data-action="recommend"]');next?.focus();}});
$('content').addEventListener('submit',e=>{if(e.target.id==='upload-form'){e.preventDefault();upload(e.target);}if(e.target.id==='chat-form'){e.preventDefault();ask($('chat-input').value);}if(e.target.id==='hr-login'){e.preventDefault();hrLogin($('hr-password').value);}if(e.target.id==='draft-form'){e.preventDefault();publishDraft();}});
async function loadCatalogs(){const role=state.view==='hr'?'hr':'employee:'+state.id;const results=await Promise.allSettled([api('api/skills',{role}),api('api/events',{role})]);if(results[0].status==='fulfilled')state.skills=results[0].value;if(results[1].status==='fulfilled'&&Array.isArray(results[1].value))state.events=Object.fromEntries(results[1].value.map(e=>[e.event_id,e]));if(state.view==='employee'&&state.profile&&!state.mutating)render();}
loadDirectory();loadMeta();loadView();loadCatalogs();
</script>
</body>
</html>
