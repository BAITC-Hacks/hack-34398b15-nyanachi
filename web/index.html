function uncovered(gaps){return gaps?.length?alertBox(t('uncovered',{skills:gaps.map(g=>skillName(g.skill_id||g)).join(', ')})) : '';}
function renderEmployee(){const p=state.profile,e=p.employee||{},target=p.target||{},completed=p.completed||[],goal=e.career_goal&&typeof e.career_goal==='object'?[e.career_goal.target_role,e.career_goal.target_grade].filter(Boolean).join(' · '):e.career_goal;return '<div class="page-heading"><div><p class="eyebrow">'+esc(t('yourGrowth'))+'</p><h1>'+esc(e.full_name||e.employee_id||state.id)+'</h1><p class="muted small">'+esc([e.role,e.grade,t('tenure',{n:number(e.tenure_months)})].filter(Boolean).join(' · '))+'</p></div><span class="pill neutral">'+esc(e.employee_id||state.id)+'</span></div><div class="employee-grid"><aside class="panel" aria-label="'+esc(t('path',{grade:target.grade||t('development')}))+'"><h2>'+esc(t('path',{grade:target.grade||t('development')}))+'</h2><p class="muted small">'+esc(target.role||t('noTarget'))+'</p>'+(goal?'<p class="meta">'+esc(t('careerGoal'))+': '+esc(goal)+'</p>':'')+'<div class="readiness"><div class="readiness-line"><span class="small">'+esc(t('readiness'))+'</span><strong>'+Math.round(pct(p.readiness))+'%</strong></div><div class="track" role="progressbar" aria-label="'+esc(t('readiness'))+'" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct(p.readiness)+'"><span style="width:'+pct(p.readiness)+'%"></span></div></div><p class="meta">'+esc(t('currentRequired'))+'</p>'+skillRows(p)+(Object.keys(p.effective_skills||e.skills||{}).some(id=>!Object.hasOwn(target.required||{},id))?'<details><summary>'+esc(t('otherSkills'))+'</summary><p class="meta">'+esc(t('skillScale'))+'</p>'+skillRows(p,true)+'</details>':'')+(p.applied_after_review?.length?alertBox(t('updated')+' · '+p.applied_after_review.length,'success'):'')+'<p class="meta">'+esc(t('review'))+': '+esc(date(e.last_review_date))+'</p><details><summary>'+esc(t('completedActivities'))+' <span class="pill neutral">'+completed.length+'</span></summary>'+(completed.length?'<ul class="history">'+[...completed].sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(row=>'<li><span aria-hidden="true" style="color:var(--green)">✓ </span>'+esc(row.title||row.event_title||state.events[row.event_id]?.title||row.event_id)+'<time>'+esc(date(row.date))+'</time></li>').join('')+'</ul>':'<p class="muted small">'+esc(t('noCompleted'))+'</p>')+'</details></aside><section class="panel"><div class="section-head"><div><h2>'+esc(t('nextSteps'))+'</h2><p class="muted small">'+esc(t('nextDescription'))+'</p></div><div class="actions"><label class="toggle"><input id="use-ai" type="checkbox" '+(state.ai?'checked ':'')+(state.recommending||state.mutating?'disabled':'')+'>'+esc(t('useAI'))+'</label><button class="primary" data-action="recommend" '+(state.recommending||state.mutating?'disabled':'')+'>'+esc(t(state.rec?'refreshRecommendations':'recommend'))+'</button></div></div><div id="recommendation-content">'+renderRecommendations()+'</div><p class="meta" style="margin-top:18px">'+esc(t('languageNote'))+' · '+esc(t('eligible',{n:(p.eligible_steps||[]).length}))+'</p></section></div>';}
function renderRecommendations(){if(state.recommending)return '<div class="loading-card" role="status"><span class="spinner" aria-hidden="true"></span><h3>'+esc(t('generating'))+'</h3><p class="muted small">'+esc(t('generatingHint'))+'</p></div>';const r=state.rec;if(!r)return empty(t('getStarted'),t('getStartedHint'),'↗')+uncovered(state.profile?.uncovered_gaps);const steps=(r.steps||[]).filter(s=>!state.hidden.has(s.event_id));return '<div class="rec-meta"><span class="pill">'+esc(r.mode==='ai'?t('ai')+(r.model?' · '+r.model:''):t('rules'))+'</span>'+(r.latency_s!=null?'<span class="meta">'+esc(t('latency',{seconds:number(r.latency_s).toFixed(1)}))+'</span>':'')+'</div>'+(r.summary?'<p class="summary" lang="'+esc(recLanguage())+'">'+esc(plain(r.summary))+'</p>':'')+'<div class="recommendations">'+(steps.length?steps.map(renderStep).join(''):empty(t('noSteps'),t((r.steps||[]).length?'hiddenSteps':'noStepsHint')))+'</div>'+(r.why_not&&plain(r.why_not)?'<div class="notice info"><strong>'+esc(t('whyNot'))+'</strong><p lang="'+esc(recLanguage())+'" style="white-space:pre-line;margin:6px 0 0">'+esc(plain(r.why_not))+'</p></div>':'')+uncovered(r.uncovered_gaps||state.profile?.uncovered_gaps);}
function renderStep(s){const f=s.factors||{},reliability=f.format_reliability;const gains=s.gains||[];const chips=[];if(f.closes_critical_gap)chips.push('<span class="pill critical">'+esc(t('criticalGap'))+'</span>');if(s.unlocks)chips.push('<span class="pill unlock">🔓 '+esc(t('unlocks',{title:s.unlocks.title}))+'</span>');gains.forEach(g=>chips.push('<span class="pill">'+esc(t('gain',{n:Math.max(0,number(g.to)-number(g.from)),skill:skillName(g.skill_id)}))+'</span>'));if(reliability&&typeof reliability==='object'&&(number(reliability.completed)+number(reliability.skipped))>0)chips.push('<span class="pill">'+esc(t('reliability',{done:number(reliability.completed),total:number(reliability.completed)+number(reliability.skipped),format:label('format',s.format)}))+'</span>');if(number(f.similar_skips)>0)chips.push('<span class="pill amber">'+esc(t('similarSkips',{n:f.similar_skips}))+'</span>');return '<article class="step"><div class="step-top"><div class="step-icon" aria-hidden="true">'+(s.type==='mentoring'?'◎':s.type==='workshop'?'◇':'↗')+'</div><div class="step-body"><p class="meta">'+esc(label('type',s.type))+'</p><h3>'+esc(s.title||s.event_id)+'</h3><div class="step-meta"><span>'+esc(label('format',s.format))+'</span>'+(s.duration_hours!=null?'<span>'+esc(t('hours',{n:s.duration_hours}))+'</span>':'')+'<span>'+esc(t('nextSession'))+': '+esc(s.next_session?date(s.next_session):t('unscheduled'))+'</span></div></div></div><div class="chips">'+chips.join('')+'</div><p class="rationale" lang="'+esc(recLanguage())+'">'+esc(plain(s.rationale))+'</p><div class="factors">'+(s.factors_used||[]).map(factor=>'<span class="factor">'+esc(typeof factor==='string'?label('factor',factor):plain(factor))+'</span>').join('')+'</div><div class="actions"><button class="primary" data-action="complete" data-id="'+esc(s.event_id)+'" '+(state.mutating?'disabled':'')+'>✓ '+esc(t(state.mutating?'saving':'done'))+'</button><button class="button-quiet" data-action="hide" data-id="'+esc(s.event_id)+'" '+(state.mutating?'disabled':'')+'>'+esc(t('notNow'))+'</button></div></article>';}
function renderHR(){const h=state.hr,lag=h.lagging_skills||[],blocked=h.no_recommended_step||[],participation=h.participation||[],top=[...lag].sort((a,b)=>number(b.employees)-number(a.employees))[0];const statuses=['completed','no_show','declined','dropped','overdue','in_progress'];const max=Math.max(1,...lag.map(s=>number(s.employees)));return '<div class="page-heading"><div><p class="eyebrow">'+esc(t('hrEyebrow'))+'</p><h1>'+esc(t('hrTitle'))+'</h1><p class="muted small">'+esc(t('hrSubtitle'))+'</p></div><span class="pill">HR</span></div><div class="kpis"><div class="panel kpi"><div class="kpi-icon" aria-hidden="true">◎</div><div><strong>'+number(h.employees)+'</strong><p>'+esc(t('employees'))+'</p></div></div><div class="panel kpi"><div class="kpi-icon" style="background:#fff3d6;color:var(--amber)" aria-hidden="true">↗</div><div><strong>'+blocked.length+'</strong><p>'+esc(t('noRecommended'))+'</p></div></div><div class="panel kpi"><div class="kpi-icon" aria-hidden="true">▥</div><div><strong class="skill-kpi">'+esc(top?.name||skillName(top?.skill_id)||'—')+'</strong><p>'+esc(t('topLagging'))+'</p></div></div></div><div class="hr-grid"><section class="panel"><h2>'+esc(t('laggingSkills'))+'</h2><p class="muted small">'+esc(t('peopleBelow'))+'</p>'+(lag.length?'<div class="chart">'+lag.map(s=>'<div class="chart-line"><span>'+esc(s.name||skillName(s.skill_id))+'</span><div class="track" aria-hidden="true"><span style="width:'+pct(number(s.employees)/max*100)+'%"></span></div><strong>'+number(s.employees)+'</strong></div>').join('')+'</div>':empty(t('noGaps')))+'</section><section class="panel"><h2>'+esc(t('noRecommended'))+'</h2>'+(blocked.length?'<div class="scroll-table"><table><caption class="visually-hidden">'+esc(t('noRecommended'))+'</caption><thead><tr>'+['employeeId','role','grade','target','reason'].map(key=>'<th scope="col">'+esc(t(key))+'</th>').join('')+'</tr></thead><tbody>'+blocked.map(e=>'<tr><td>'+esc(e.employee_id)+'</td><td>'+esc(e.role)+'</td><td>'+esc(e.grade)+'</td><td>'+esc(typeof e.target==='object'?[e.target?.role,e.target?.grade].filter(Boolean).join(' · '):e.target||t('noTarget'))+'</td><td>'+esc(e.top_exclusion?t('r_'+String(e.top_exclusion).replace(/^prerequisite.*/,'prerequisite')):t('unknown'))+'</td></tr>').join('')+'</tbody></table></div>':empty(t('noBlocked'),'','✓'))+'</section></div><section class="panel"><h2>'+esc(t('participation'))+'</h2><p class="muted small">'+esc(t('participationHint'))+'</p>'+(participation.length?'<div class="scroll-table"><table><caption class="visually-hidden">'+esc(t('participation'))+'</caption><thead><tr><th scope="col">'+esc(t('activity'))+'</th>'+statuses.map(s=>'<th scope="col">'+esc(t(s))+'</th>').join('')+'</tr></thead><tbody>'+participation.map(e=>'<tr><td class="event">'+esc(e.title||e.event_id)+'<small>'+esc(e.event_id)+'</small></td>'+statuses.map(s=>'<td><span class="count '+s+'">'+number(e[s])+'</span></td>').join('')+'</tr>').join('')+'</tbody></table></div>':empty(t('noParticipation')))+'</section><section class="panel upload"><h2>'+esc(t('uploadTitle'))+'</h2><p class="muted small">'+esc(t('uploadHint'))+'</p><form id="upload-form"><div class="upload-fields"><div class="field"><label for="employees-file">'+esc(t('employeeFile'))+'</label><input id="employees-file" name="employees" type="file" accept=".json,application/json"></div><div class="field"><label for="history-file">'+esc(t('historyFile'))+'</label><input id="history-file" name="history" type="file" accept=".csv,text/csv"></div><button type="submit" class="primary">'+esc(t('upload'))+'</button></div><div id="upload-status" role="status" aria-live="polite"></div></form></section>';}
function render(){syncLabels();$('content').setAttribute('aria-busy',String(state.loading));if(state.loading){$('content').innerHTML=loading(t(state.view==='hr'?'loadHR':'loadProfile'));return;}if(state.error){$('content').innerHTML=alertBox(state.error,'error')+'<button data-action="retry">'+esc(t('retry'))+'</button>';return;}$('content').innerHTML=state.view==='hr'?renderHR():renderEmployee();}
function lockControls(locked){state.mutating=locked;['view','employee-search','employee-select'].forEach(id=>$(id).disabled=locked);document.querySelectorAll('[data-lang]').forEach(el=>el.disabled=locked);}
async function recommend(){if(state.recommending||state.mutating||!state.profile)return;const version=state.version;state.recommending=true;$('flash').innerHTML='';render();try{const rec=await api('api/employees/'+encodeURIComponent(state.id)+'/recommend?ai='+state.ai,{method:'POST',signal:state.controller.signal});if(version!==state.version)return;state.rec=rec;state.hidden.clear();}catch(error){if(version===state.version&&error.name!=='AbortError')flash(error.message,'error');}finally{if(version===state.version){state.recommending=false;render();}}}
async function complete(eventId){if(state.mutating||!state.rec?.steps?.some(s=>s.event_id===eventId))return;lockControls(true);render();let saved=false;try{const result=await api('api/employees/'+encodeURIComponent(state.id)+'/complete',{method:'POST',body:{event_id:eventId}});saved=true;state.rec=null;state.hidden.clear();flash(t('completion',{before:Math.round(pct(result.readiness_before)),after:Math.round(pct(result.readiness_after))}));state.profile=await api('api/employees/'+encodeURIComponent(state.id));}catch(error){if(saved){state.error=t('refreshFailed');}else flash(error.message,'error');}finally{lockControls(false);render();}}
async function upload(form){if(state.mutating)return;const data=new FormData();for(const key of ['employees','history']){const file=form.elements[key].files[0];if(file)data.append(key,file);}if(![...data.keys()].length){$('upload-status').innerHTML=alertBox(t('chooseFile'),'error');return;}lockControls(true);form.querySelectorAll('input,button').forEach(el=>el.disabled=true);const button=form.querySelector('button');button.textContent=t('uploading');let saved=false;try{const result=await api('api/data/upload',{role:'hr',method:'POST',body:data});saved=true;const message=t('uploaded',{employees:Array.isArray(result.added_employees)?result.added_employees.length:number(result.added_employees),history:number(result.added_history)});state.hr=await api('api/hr/summary',{role:'hr'});await Promise.all([loadDirectory(),loadMeta()]);flash(message);lockControls(false);render();}catch(error){$('upload-status').innerHTML=alertBox(saved?t('uploadRefreshFailed'):error.message,saved?'info':'error');}finally{lockControls(false);if(form.isConnected){form.querySelectorAll('input,button').forEach(el=>el.disabled=false);button.textContent=t('upload');if(saved)form.reset();}}}
$('view').addEventListener('change',e=>{state.view=e.target.value;loadView();});$('employee-search').addEventListener('input',fillEmployees);$('employee-select').addEventListener('change',e=>{state.id=e.target.value;loadView();});
document.querySelectorAll('[data-lang]').forEach(el=>el.addEventListener('click',()=>{if(state.mutating)return;state.lang=el.dataset.lang;render();fillEmployees();}));
$('content').addEventListener('change',e=>{if(e.target.id==='use-ai')state.ai=e.target.checked;});
$('content').addEventListener('click',e=>{const button=e.target.closest('button[data-action]');if(!button||button.disabled)return;const action=button.dataset.action;if(action==='retry')loadView();if(action==='recommend')recommend();if(action==='complete')complete(button.dataset.id);if(action==='hide'){state.hidden.add(button.dataset.id);render();const next=$('content').querySelector('[data-action="complete"]')||$('content').querySelector('[data-action="recommend"]');next?.focus();}});
$('content').addEventListener('submit',e=>{if(e.target.id==='upload-form'){e.preventDefault();upload(e.target);}});
async function loadCatalogs(){const role=state.view==='hr'?'hr':'employee:'+state.id;const results=await Promise.allSettled([api('api/skills',{role}),api('api/events',{role})]);if(results[0].status==='fulfilled')state.skills=results[0].value;if(results[1].status==='fulfilled'&&Array.isArray(results[1].value))state.events=Object.fromEntries(results[1].value.map(e=>[e.event_id,e]));if(state.view==='employee'&&state.profile&&!state.mutating)render();}
loadDirectory();loadMeta();loadView();loadCatalogs();
</script>
</body>
