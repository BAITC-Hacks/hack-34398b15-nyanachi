 const controller=new AbortController();let timedOut=false;const abort=()=>controller.abort();if(signal?.aborted)controller.abort();else signal?.addEventListener('abort',abort,{once:true});
 const timer=setTimeout(()=>{timedOut=true;controller.abort();},timeout);
 const who=role||(state.view==='hr'?'hr':'employee:'+state.id);try{const headers={'X-Auth-Token':await tokenFor(who)};if(body&&!(body instanceof FormData))headers['Content-Type']='application/json';

 }catch(error){if(timedOut)throw new Error(t('timeout'));if(error.name==='AbortError')throw error;if(error instanceof TypeError)throw new Error(t('networkError'));throw error;}
 finally{clearTimeout(timer);signal?.removeEventListener('abort',abort);}
}

function skillRows(p,other=false){const required=p.target?.required||{};const levels=p.effective_skills||p.employee?.skills||{};const critical=new Set(p.target?.critical||[]);const gaps=new Map((p.gaps||[]).map(g=>[g.skill_id,g]));return [...new Set([...Object.keys(required),...Object.keys(levels)])].filter(id=>other?!Object.hasOwn(required,id):Object.hasOwn(required,id)).sort((a,b)=>Number(critical.has(b))-Number(critical.has(a))).map(id=>{const current=number(levels[id]);const req=number(required[id]);const isCritical=(critical.has(id)||gaps.get(id)?.critical)&&current<req;const max=req||5;return '<div class="skill '+(isCritical?'critical':'')+'"><div class="skill-line"><span class="name">'+catIcon(id)+esc(skillName(id))+(isCritical?' <span class="pill critical">'+esc(t('critical'))+'</span>':'')+'</span><span class="levels">'+current+' / '+max+'</span></div><div class="track" role="meter" aria-label="'+esc(skillName(id))+'" aria-valuemin="0" aria-valuemax="'+Math.max(max,current)+'" aria-valuenow="'+current+'" aria-valuetext="'+esc(current+' / '+max)+'"><span style="width:'+pct(current/max*100)+'%"></span></div></div>';}).join('');}

function renderEmployee(){const p=state.profile,e=p.employee||{},target=p.target||{},completed=p.completed||[],goal=e.career_goal&&typeof e.career_goal==='object'?[roleName(e.career_goal.target_role),e.career_goal.target_grade].filter(Boolean).join(' · '):e.career_goal;const g=state.garden,w=state.wallet,rd=Math.round(pct(p.readiness)),alert=(p.uncovered_gaps||[]).some(x=>x.critical),tgt=[target.role&&target.role!==e.role?roleName(target.role):'',target.grade].filter(Boolean).join(' · ');return '<div class="page-heading hb"><div><p class="crumb">'+esc(t('navDev'))+'</p><h1>'+esc(e.full_name||e.employee_id||state.id)+'</h1><p class="sub">'+esc([roleName(e.role),e.grade,t('tenure',{n:number(e.tenure_months)})].filter(Boolean).join(' · '))+(tgt?'<span class="vsep" aria-hidden="true"></span>'+esc(t('targetLbl',{x:tgt})):'')+'</p></div><span class="pill neutral">'+esc(e.employee_id||state.id)+'</span></div>'+'<div class="statrow'+(alert?'':' solo')+'">'+(alert?'<button class="stat-alert" data-action="goto" data-tab="mentors"><span class="sa-ic" aria-hidden="true">⚠</span><span>'+esc(t('heroMentoring'))+'</span><span class="chip-link">'+esc(t('exploreMentors'))+' →</span></button>':'')+'<div class="stat-card">'+(g?'<div class="sc-item"><span class="sc-ic" aria-hidden="true">🌱</span><div><strong>'+esc(t('levelN',{n:g.level.level}))+' · '+esc(t('lvl_'+g.level.title.replace(/ /g,'_')))+'</strong><span class="meta"><b>'+g.grown+'/'+g.total+'</b> '+esc(t('heroPlants'))+'</span></div></div>':'')+(w?'<div class="sc-item"><span class="sc-ic star" aria-hidden="true">☆</span><div><strong>'+number(w.balance)+'</strong><span class="meta">'+esc(t('points'))+'</span></div></div>':'')+'<div class="sc-item"><span class="sc-ic" aria-hidden="true">✓</span><div><strong>'+completed.length+'</strong><span class="meta">'+esc(t('doneLbl'))+'</span></div></div></div></div>'+'<div class="emp-b"><div class="colL"><section class="ready-hero" aria-label="'+esc(t('readyTitle'))+'"><div class="rh-top"><div><h2>'+esc(t('readyTitle'))+'</h2><p>'+esc(t('readyFor',{grade:target.grade||t('development')}))+'</p></div><strong>'+rd+'%</strong></div><div class="rh-track" role="progressbar" aria-label="'+esc(t('readiness'))+'" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+rd+'"><span style="width:'+pct(p.readiness)+'%"></span></div>'+(p.readiness_breakdown?'<details class="calc"><summary>'+esc(t('howCalc'))+'</summary><p class="small">'+esc(t('calcFormula'))+'</p><p class="calc-line">'+number(p.readiness_breakdown.counted)+' / '+number(p.readiness_breakdown.required)+' = <strong>'+number(p.readiness_breakdown.pct)+'%</strong></p>'+(p.readiness_breakdown.missing.length?'<p class="small">'+esc(t('calcMissing'))+'</p><ul class="calc-list">'+p.readiness_breakdown.missing.map(x=>'<li>'+esc(skillName(x.skill_id))+(x.critical?' <span class="pill critical">'+esc(t('critical'))+'</span>':'')+'<span class="meta"> '+x.level+' → '+x.required+' · +'+x.missing+'</span></li>').join('')+'</ul>':'')+'</details>':'')+'</section>'+'<div class="panel skills-card"><h2>'+esc(t('skillsTarget'))+'</h2><p class="muted small">'+esc(t('path',{grade:target.grade||t('development')}))+' · '+esc(roleName(target.role)||t('noTarget'))+'</p>'+(goal?'<p class="meta">'+esc(t('careerGoal'))+': '+esc(goal)+'</p>':'')+'<p class="meta">'+esc(t('currentRequired'))+'</p>'+skillRows(p)+(Object.keys(p.effective_skills||e.skills||{}).some(id=>!Object.hasOwn(target.required||{},id))?'<details><summary>'+esc(t('otherSkills'))+'</summary><p class="meta">'+esc(t('skillScale'))+'</p>'+skillRows(p,true)+'</details>':'')+(p.applied_after_review?.length?alertBox(t('updated')+' · '+p.applied_after_review.length,'success'):'')+'<p class="meta">'+esc(t('review'))+': '+esc(date(e.last_review_date))+'</p><details><summary>'+esc(t('completedActivities'))+' <span class="pill neutral">'+completed.length+'</span></summary>'+(completed.length?'<ul class="history">'+[...completed].sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(row=>'<li><span aria-hidden="true" style="color:var(--green)">✓ </span>'+esc(evTitle(row.event_id,row.title||row.event_title))+'<time>'+esc(date(row.date))+'</time></li>').join('')+'</ul>':'<p class="muted small">'+esc(t('noCompleted'))+'</p>')+'</details>'+'<details open><summary>'+esc(t('availableSteps'))+' <span class="pill neutral">'+(p.eligible_steps||[]).length+'</span></summary>'+((p.eligible_steps||[]).length?'<ul class="history">'+p.eligible_steps.map(x=>'<li>'+typeIcon(x.type,18)+esc(evTitle(x.event_id,x.title))+'<span class="meta"> · '+esc(label('format',x.format))+(x.next_session?' · '+esc(date(x.next_session)):'')+(x.gains||[]).filter(g=>g.to>g.from).map(g=>' · +'+(g.to-g.from)+' '+esc(skillName(g.skill_id))).join('')+'</span></li>').join('')+'</ul>':'<p class="muted small">'+esc(t('noAvailable'))+'</p>')+'</details>'+'</div></div>'+'<div class="colR">'+'<section class="panel rec-panel"><div class="section-head"><div><h2>'+esc(t('nextSteps'))+'</h2><p class="muted small">'+esc(t('nextDescription'))+'</p></div><div class="actions"><label class="toggle"><input id="use-ai" type="checkbox" '+(state.ai?'checked ':'')+(state.recommending||state.mutating?'disabled':'')+'>'+esc(t('useAI'))+'</label><button class="primary" data-action="recommend" '+(state.recommending||state.mutating?'disabled':'')+'>✦ '+esc(t(state.rec?'refreshRecommendations':'recommend'))+'</button></div></div><div id="recommendation-content">'+renderRecommendations()+'</div><p class="meta" style="margin-top:18px">'+esc(t('languageNote'))+' · '+esc(t('eligible',{n:(p.eligible_steps||[]).length}))+'</p></section>'+'<div class="duo">'+gardenMini()+'<div class="panel mini-card mentor-mini"><div class="mc-head"><h3>'+esc(t('mentorCardTitle'))+'</h3><button class="link-btn" data-action="goto" data-tab="mentors">'+esc(t('exploreMentors'))+' →</button></div><p class="small muted">'+esc(t('mentorCardSub'))+'</p><img class="mm-art" src="static/icons/type_mentoring.png" alt="" loading="lazy"></div></div></div></div>'+renderTabs();}
function gardenMini(){const g=state.garden;return '<div class="panel mini-card garden-mini"><div class="mc-head"><h3>'+esc(t('gardenCardTitle'))+'</h3><button class="link-btn" data-action="goto" data-tab="garden">'+esc(t('openGarden'))+' →</button></div><div class="gm-art"><img src="static/garden/banner.jpg" alt="" loading="lazy">'+(g?'<div class="gm-cap"><strong>'+esc(t('levelN',{n:g.level.level}))+' · '+esc(t('lvl_'+g.level.title.replace(/ /g,'_')))+'</strong><span>'+g.grown+'/'+g.total+' '+esc(t('heroPlants'))+'</span></div>':'')+'</div></div>';}
function gardenCard(){const g=state.garden;const lvl=g?'<div class="gc-foot"><span>🌱 <strong>'+esc(t('levelN',{n:g.level.level}))+'</strong> · '+esc(t('lvl_'+g.level.title.replace(/ /g,'_')))+'</span><span>🌳 <strong>'+g.grown+'/'+g.total+'</strong> '+esc(t('heroPlants'))+'</span></div>':'';return '<div class="panel garden-card"><div class="gc-head"><div><h2>'+esc(t('gardenCardTitle'))+'</h2><p class="muted small">'+esc(t('gardenCardSub'))+'</p></div><button class="button-quiet" data-action="goto" data-tab="garden">'+esc(t('openGarden'))+' →</button></div><img class="gc-art" src="static/garden/banner.jpg" alt="" loading="lazy">'+lvl+'</div>';}
function goTo(tab){state.tab=tab;state.navOn=tab;render();if(tab==='path'&&!state.path)loadPath();if(tab==='mentors'&&!state.mentors)loadMentors();document.querySelector('.tabs')?.scrollIntoView({behavior:'smooth',block:'start'});}
function heroChips(p){const g=state.garden,w=state.wallet,tg=p.target||{};const chips=['<span class="hero-chip"><strong>'+Math.round(pct(p.readiness))+'%</strong> '+esc(t('heroReady',{grade:tg.grade||''}))+'</span>'];if(g)chips.push('<span class="hero-chip">🌱 <strong>'+esc(t('levelN',{n:g.level.level}))+'</strong> · '+esc(t('lvl_'+g.level.title.replace(/ /g,'_')))+'</span>','<span class="hero-chip">🌳 <strong>'+g.grown+'/'+g.total+'</strong> '+esc(t('heroPlants'))+'</span>');if(w)chips.push('<span class="hero-chip">⭐ <strong>'+number(w.balance)+'</strong> '+esc(t('points'))+'</span>');if((p.uncovered_gaps||[]).some(x=>x.critical))chips.push('<button class="hero-chip warn" data-action="goto" data-tab="mentors">⚠ '+esc(t('heroMentoring'))+' <span class="chip-link">'+esc(t('exploreMentors'))+' →</span></button>');return '<div class="hero-chips">'+chips.join('')+'</div>';}
function renderTabs(){const tabs=[['navigator','chat','💬'],['garden','garden','🌱'],['points','points','⭐'],['path','path','🧭'],['mentors','mentors','🤝']];const cur=state.tab||'navigator';const body=cur==='navigator'?renderChat():cur==='garden'?renderGarden():cur==='points'?renderWallet():cur==='path'?renderPath():renderMentors();return '<nav class="tabs" role="tablist" aria-label="'+esc(t('moreTools'))+'">'+tabs.map(([k,lab,ic])=>'<button role="tab" class="tab'+(cur===k?' on':'')+'" aria-selected="'+(cur===k)+'" data-action="tab" data-tab="'+k+'"><span aria-hidden="true">'+ic+'</span> '+esc(t('tab_'+lab))+'</button>').join('')+'</nav><div class="tab-body" role="tabpanel">'+(body||'<p class="muted small" style="padding:20px">'+esc(t('pathLoading'))+'</p>')+'</div>';}
function renderPath(){const p=state.path;let body;if(state.pathLoading)body='<p class="muted small" role="status">'+esc(t('pathLoading'))+'</p>';else if(!p)body='<p class="muted small">'+esc(t('pathHint'))+'</p>';else if(!p.steps.length)body='<p class="muted small">'+esc(t('pathNone'))+'</p>';else body='<p class="path-summary"><strong>'+Math.round(p.readiness_now)+'% → '+Math.round(p.readiness_after)+'%</strong> '+esc(t('pathBy',{date:date(p.estimated_by)}))+'</p><ol class="path-list">'+p.steps.map(s=>'<li><span class="path-title">'+esc(evTitle(s.event_id,s.title))+(s.critical_met?' <span class="pill">'+esc(t('pathCritical'))+'</span>':'')+'</span><span class="path-pct">'+Math.round(s.readiness_after)+'%</span><span class="meta">'+esc(label('format',s.format))+(s.date?' · '+esc(date(s.date))+' · <a href="api/events/'+encodeURIComponent(s.event_id)+'/ics?date='+encodeURIComponent(s.date)+'" download>📅 '+esc(t('addCal'))+'</a>':'')+'</span></li>').join('')+'</ol>'+(p.remaining_gaps.length?'<p class="meta">'+esc(t('pathRemaining',{n:p.remaining_gaps.length}))+'</p>':'');return '<section class="panel path-panel"><div class="path-head"><div><h2>'+esc(t('pathTitle',{grade:(p&&p.target&&p.target.grade)||(state.profile&&state.profile.target&&state.profile.target.grade)||''}))+'</h2><p class="muted small">'+esc(t('pathSub'))+'</p></div><button class="button-quiet" data-action="path" '+(state.pathLoading||state.mutating?'disabled':'')+'>'+esc(t('pathBtn'))+'</button></div>'+body+'</section>';}
function renderMentors(){const m=state.mentors;let body;if(state.mentorsLoading)body='<p class="muted small" role="status">'+esc(t('pathLoading'))+'</p>';else if(!m)body='<p class="muted small">'+esc(t('mentorHint'))+'</p>';else if(!m.mentors.length)body='<p class="muted small">'+esc(t('mentorNone'))+'</p>';else body='<ul class="mentor-list">'+m.mentors.map(x=>'<li><div class="mentor-avatar" aria-hidden="true">'+esc((x.full_name||'?').split(' ').map(w=>w[0]).join('').slice(0,2))+'</div><div><strong>'+esc(x.full_name)+'</strong><p class="meta">'+esc(roleName(x.role))+' · '+esc(x.grade)+'</p><p class="small">'+esc(t('mentorFor',{skill:x.skill}))+(x.no_course_available?' <span class="pill">'+esc(t('mentorNoCourse'))+'</span>':'')+'</p><button class="button-quiet" data-action="kudos" data-id="'+esc(x.employee_id)+'" '+((state.thanked||new Set()).has(x.employee_id)?'disabled':'')+'>'+esc((state.thanked||new Set()).has(x.employee_id)?t('thanked'):t('sayThanks'))+'</button></div></li>').join('')+'</ul><p class="meta">'+esc(t('mentorPrivacy'))+'</p>';return '<section class="panel path-panel"><div class="path-head"><div><h2>'+esc(t('mentorTitle'))+'</h2><p class="muted small">'+esc(t('mentorSub'))+'</p></div><button class="button-quiet" data-action="mentors" '+(state.mentorsLoading?'disabled':'')+'>'+esc(t('mentorBtn'))+'</button></div>'+body+'</section>';}
async function sendKudos(to){state.thanked=state.thanked||new Set();try{const r=await api('api/employees/'+encodeURIComponent(state.id)+'/kudos',{method:'POST',body:{to_employee_id:to,message:t('kudosMsg')}});state.thanked.add(to);flash(t('kudosSent',{name:r.to,n:r.points}));}catch(error){flash(error.message,'error');}render();}
async function loadMentors(){if(state.mentorsLoading||!state.profile)return;const version=state.version;state.mentorsLoading=true;render();try{const r=await api('api/employees/'+encodeURIComponent(state.id)+'/mentors');if(version===state.version)state.mentors=r;}catch(error){if(version===state.version)flash(error.message,'error');}finally{if(version===state.version){state.mentorsLoading=false;render();}}}
function renderChat(){const msgs=state.chat||[];const off=state.meta?.ai_enabled===false;return '<section class="panel path-panel chat-panel"><div class="path-head"><div><h2>'+esc(t('chatTitle'))+'</h2><p class="muted small">'+esc(t('chatSub'))+'</p></div></div>'+(off?alertBox(t('chatNoKey'),'info'):'')+'<div class="chat-log" id="chat-log" aria-live="polite">'+(msgs.length?msgs.map(m=>'<div class="msg '+m.role+'"><div class="bubble">'+(m.role==='assistant'?md(m.content):esc(m.content))+'</div>'+(m.tools&&m.tools.length?'<div class="tools">'+esc(t('chatTools'))+': '+m.tools.map(x=>'<span class="pill neutral">'+esc(x.tool)+'</span>').join(' ')+(m.latency?' <span class="meta">'+number(m.latency).toFixed(1)+' s</span>':'')+'</div>':'')+'</div>').join(''):'<div class="chat-examples">'+[t('chatEx1'),t('chatEx2'),t('chatEx3')].map(q=>'<button class="button-quiet" data-action="ask" data-q="'+esc(q)+'"'+(off?' disabled':'')+'>'+esc(q)+'</button>').join('')+'</div>')+(state.chatBusy?'<div class="msg assistant"><div class="bubble"><span class="spinner" aria-hidden="true"></span> '+esc(t('chatThinking'))+'</div></div>':'')+'</div>'+'<form id="chat-form" class="chat-form"><label for="chat-input" class="visually-hidden">'+esc(t('chatTitle'))+'</label><input id="chat-input" autocomplete="off" maxlength="1000" placeholder="'+esc(t('chatPlaceholder'))+'" '+(state.chatBusy||off?'disabled':'')+'><button class="primary" '+(state.chatBusy||off?'disabled':'')+'>'+esc(t('chatSend'))+'</button></form></section>';}
function md(text){return esc(text).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');}
async function dismiss(eventId,reason){if(state.mutating)return;lockControls(true);try{await api('api/employees/'+encodeURIComponent(state.id)+'/feedback',{method:'POST',body:{event_id:eventId,reason}});state.hidden.add(eventId);state.askReason=null;state.path=null;flash(t('reasonSaved'));state.profile=await api('api/employees/'+encodeURIComponent(state.id));}catch(error){flash(error.message,'error');}finally{lockControls(false);render();}}
async function ask(q){q=(q||'').trim();if(!q||state.chatBusy)return;const version=state.version;const history=state.chat.map(m=>({role:m.role,content:m.content}));state.chat.push({role:'user',content:q});state.chatBusy=true;render();try{const r=await api('api/employees/'+encodeURIComponent(state.id)+'/chat',{method:'POST',body:{message:q,history}});if(version!==state.version)return;state.chat.push({role:'assistant',content:r.answer,tools:r.tools_used,latency:r.latency_s});}catch(error){if(version===state.version)state.chat.push({role:'assistant',content:error.message});}finally{if(version===state.version){state.chatBusy=false;render();const log=$('chat-log');if(log)log.scrollTop=log.scrollHeight;$('chat-input')?.focus();}}}
function renderGarden(){const g=state.garden;if(!g)return '';const L=g.level,span=L.next_at?Math.round(100*(L.points-L.floor)/(L.next_at-L.floor)):100;return '<section class="panel path-panel garden-panel"><div class="path-head"><div><h2>'+esc(t('gardenTitle'))+'</h2><p class="muted small">'+esc(t('gardenSub'))+'</p></div>'+'<div class="level-box"><strong>'+esc(t('levelN',{n:L.level}))+' · '+esc(t('lvl_'+L.title.replace(/ /g,'_')))+'</strong><div class="track"><span style="width:'+span+'%"></span></div><span class="meta">'+(L.next_at?esc(t('toNext',{n:L.next_at-L.points})):esc(t('maxLevel')))+'</span></div></div>'+'<p class="small">'+esc(t('gardenGrown',{n:g.grown,total:g.total}))+'</p>'+(g.team?'<div class="team-goal"><span class="small"><strong>'+esc(t('teamGoal',{dept:g.team.department}))+'</strong> · '+esc(t('teamGoalText',{done:g.team.done,goal:g.team.goal,days:g.team.days}))+'</span><div class="track"><span style="width:'+Math.min(100,Math.round(100*g.team.done/Math.max(1,g.team.goal)))+'%"></span></div></div>':'')+'<div class="garden">'+g.plants.map(pl=>'<figure class="plant'+(pl.grown?' grown':'')+(pl.critical?' crit':'')+'"><img src="static/garden/stage'+pl.stage+'.png" alt="'+esc(skillName(pl.skill_id))+': '+pl.stage+'/5" loading="lazy"><figcaption><span>'+esc(pl.skill||skillName(pl.skill_id))+'</span><span class="meta">'+pl.stage+' / '+pl.target+(pl.grown?' ✓':'')+(pl.critical?' · '+esc(t('critical')):'')+'</span></figcaption></figure>').join('')+'</div>'+'<div class="share-row"><label><input type="checkbox" id="share-garden" '+(g.shared?'checked':'')+'> '+esc(t('shareGarden'))+'</label><span class="meta">'+esc(t('shareHint'))+'</span></div>'+(g.shared?(g.neighbours.length?'<ul class="neighbours">'+g.neighbours.map(n=>'<li><strong>'+esc(n.full_name)+'</strong> <span class="meta">'+esc(roleName(n.role))+' · '+esc(t('lvl_'+n.level.replace(/ /g,'_')))+' · '+esc(t('blooming',{n:n.blooming,total:n.plants}))+'</span></li>').join('')+'</ul>':'<p class="muted small">'+esc(t('noNeighbours'))+'</p>'):'')+'</section>';}

return '<div class="statrow solo"><div class="stat-card">'+stat('◎','',number(h.employees),t('employees'),'skills')+stat('↗','amber',blocked.length,t('noRecommended'),'people')+stat('♡','amber',sup.length,t('supportTitle'),'people')+stat('▥','red',gaps.length,t('catalogGaps'),'skills')+'</div></div>'
+'<div class="emp-b"><div class="colL"><section class="ready-hero" aria-label="'+esc(t('teamReady'))+'"><div class="rh-top"><div><h2>'+esc(t('teamReady'))+'</h2><p>'+esc(t('teamReadySub'))+'</p></div><strong>'+rd+'%</strong></div><div class="rh-track" role="progressbar" aria-label="'+esc(t('teamReady'))+'" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+rd+'"><span style="width:'+pct(h.avg_readiness)+'%"></span></div><p class="rh-note">'+esc(t('teamReadyN',{n:number(h.ready_80),total:number(h.employees)}))+'</p></section>'+hrLagging(h)+'</div>'
+'<div class="colR"><section class="panel attention"><h2>'+esc(t('att_title'))+'</h2><p class="muted small">'+esc(t('att_sub'))+'</p>'+(items.length?'<ol class="att-list">'+items.map(([tone,title,hint,attrs,cta])=>'<li class="att '+tone+'"><div><strong>'+esc(title)+'</strong><p class="small muted">'+esc(hint)+'</p></div><button class="button-quiet" '+attrs+'>'+esc(cta)+' →</button></li>').join('')+'</ol>':empty(t('noBlocked'),'','✓'))+'</section>'
+'<div class="duo"><div class="panel mini-card"><div class="mc-head"><h3>'+esc(t('hrn_upload'))+'</h3><button class="link-btn" data-action="hrtab" data-tab="upload">'+esc(t('att_open'))+' →</button></div><p class="small muted">'+esc(t('att_upload'))+' '+esc(t('up_tryTitle'))+'.</p><div class="mini-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+NAV_ICONS.upload+'</svg></div></div><div class="panel mini-card"><div class="mc-head"><h3>'+esc(t('hrn_budget'))+'</h3><button class="link-btn" data-action="hrtab" data-tab="budget">'+esc(t('att_open'))+' →</button></div>'+(month!==null?'<p class="mini-big">≈ $'+number(month)+'<span class="meta"> / '+esc(t('perMonthN',{n:number(c.employees)}))+'</span></p>':'')+'<p class="small muted">'+esc(t('budgetMini'))+'</p></div></div></div></div>';}
function avatar(name){const n=String(name||'?');let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))%360;const ini=n.split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();return '<span class="av" style="background:hsl('+h+' 45% 92%);color:hsl('+h+' 45% 28%)" aria-hidden="true">'+esc(ini)+'</span>';}
function personHead(r){return avatar(r.full_name||r.employee_id)+'<div class="p-main"><strong>'+esc(r.full_name||r.employee_id)+'</strong><span class="meta">'+esc([r.employee_id,roleName(r.role),r.grade].filter(Boolean).join(' · '))+'</span></div>';}
function openBtn(id){return '<button class="button-quiet small-btn" data-action="open-emp" data-id="'+esc(id)+'">'+esc(t('openProfile'))+' →</button>';}
function hrBlocked(h){const rows=h.no_recommended_step||[];const kind=e=>{const x=String(e.top_exclusion||'');return x==='audience_mismatch'||x==='no_upcoming_session'?'crit':x.startsWith('prerequisite')?'info':'warn';};const code=e=>e.top_exclusion?'r_'+String(e.top_exclusion).replace(/^prerequisite.*/,'prerequisite'):'unknown';const groups={};rows.forEach(e=>{const k=code(e);groups[k]=(groups[k]||0)+1;});return '<section class="panel"><div class="sec-head"><div><h2>'+esc(t('noRecommended'))+' <span class="pill neutral">'+rows.length+'</span></h2><p class="muted small">'+esc(t('att_blockedHint'))+'</p></div><div class="sum-chips">'+Object.entries(groups).sort((a,b)=>b[1]-a[1]).map(([k,n])=>'<span class="sum-chip"><b>'+n+'</b> '+esc(t(k))+'</span>').join('')+'</div></div>'+(rows.length?'<ul class="plist">'+rows.map(e=>'<li class="prow">'+personHead(e)+'<div class="p-mid"><span class="target-chip">→ '+esc(typeof e.target==='object'?[roleName(e.target?.role),e.target?.grade].filter(Boolean).join(' · '):e.target||t('noTarget'))+'</span><span class="rpill '+kind(e)+'">'+esc(t(code(e)))+'</span></div><div class="p-act">'+openBtn(e.employee_id)+'</div></li>').join('')+'</ul>':empty(t('noBlocked'),'','✓'))+'</section>';}
function renderSupport(h){const rows=h.support||[];return '<section class="panel"><div class="sec-head"><div><h2>'+esc(t('supportTitle'))+' <span class="pill neutral">'+rows.length+'</span></h2><p class="muted small">'+esc(t('supportHint'))+'</p></div></div>'+(rows.length?'<ul class="plist">'+rows.map(r=>'<li class="prow">'+personHead(r)+'<div class="p-mid"><div class="sig-row">'+r.reasons.map(x=>'<span class="rpill warn">'+esc(t('sig_'+x.code,{n:x.n}))+'</span>').join('')+'</div><div class="sig-row">'+r.suggested_actions.map(a=>'<span class="act-chip">✓ '+esc(t('act_'+a))+'</span>').join('')+'</div></div><div class="p-act">'+openBtn(r.employee_id)+'</div></li>').join('')+'</ul>':empty(t('supportNone'),'','✓'))+'</section>';}
function hrCatalog(h){const gaps=h.catalog_gaps||[];const max=Math.max(1,...gaps.map(g=>number(g.employees)));return '<section class="panel"><h2>'+esc(t('catalogGaps'))+'</h2><p class="muted small">'+esc(t('catalogGapsHint'))+'</p>'+(gaps.length?'<ul class="gap-list">'+gaps.map(g=>'<li class="gap-row"><span class="gap-name">'+catIcon(g.skill_id,22)+'<strong>'+esc(skillName(g.skill_id))+'</strong></span><div class="gap-bar"><div class="track"><span style="width:'+pct(number(g.employees)/max*100)+'%"></span></div><span class="meta">'+esc(t('gapPeople',{n:number(g.employees)}))+'</span></div>'+(g.critical_for?'<span class="rpill crit">'+esc(t('gapCritical',{n:number(g.critical_for)}))+'</span>':'<span></span>')+'<button class="primary small-btn" data-action="draft" data-id="'+esc(g.skill_id)+'">+ '+esc(t('createActivity'))+'</button></li>').join('')+'</ul>':empty(t('noCatalogGaps'),'','✓'))+renderDraft()+'</section>';}
function hrParticipation(h){const st=['completed','in_progress','no_show','declined','dropped','overdue'];const rows=(h.participation||[]).map(e=>({e,tot:st.reduce((a,k)=>a+number(e[k]),0)})).filter(x=>x.tot>0).sort((a,b)=>b.tot-a.tot);return '<section class="panel"><div class="sec-head"><div><h2>'+esc(t('participation'))+'</h2><p class="muted small">'+esc(t('participationHint'))+'</p></div><div class="legend">'+st.map(k=>'<span><i class="sw '+k+'"></i>'+esc(t(k))+'</span>').join('')+'</div></div>'+(rows.length?'<ul class="part-list">'+rows.map(({e,tot})=>{const ev=state.events[e.event_id]||{};const rate=Math.round(100*number(e.completed)/tot);return '<li class="part-row"><div class="part-name">'+typeIcon(ev.type,26)+'<div><strong>'+esc(evTitle(e.event_id,e.title))+'</strong><span class="meta">'+esc(e.event_id)+(ev.type?' · '+esc(label('type',ev.type)):'')+(ev.mandatory?' · <span class="mand">'+esc(t('mandatoryLbl'))+'</span>':'')+'</span></div></div><div class="stack" role="img" aria-label="'+esc(st.map(k=>t(k)+': '+number(e[k])).join(', '))+'">'+st.filter(k=>number(e[k])>0).map(k=>'<span class="'+k+'" style="width:'+(100*number(e[k])/tot)+'%" title="'+esc(t(k))+': '+number(e[k])+'"></span>').join('')+'</div><div class="part-num"><strong>'+rate+'%</strong><span class="meta">'+esc(t('doneOf',{n:number(e.completed),tot:tot}))+'</span></div></li>';}).join('')+'</ul>':empty(t('noParticipation')))+'</section>';}
function renderHR(){const h=state.hr,tab=state.hrTab||'overview';const labels={overview:'hrTitle',skills:'hrn_skills',people:'hrn_people',participation:'hrn_participation',budget:'hrn_budget',upload:'hrn_upload'};const body=tab==='skills'?'<div class="hr-stack">'+hrLagging(h)+hrCatalog(h)+'</div>':tab==='people'?'<div class="hr-stack">'+hrBlocked(h)+renderSupport(h)+'</div>':tab==='participation'?hrParticipation(h):tab==='budget'?renderAiCost(h):tab==='upload'?hrUpload():hrOverview(h);return '<div class="page-heading hb"><div><p class="crumb">'+esc(t(tab==='overview'?'hrEyebrowPlain':'hrTitle'))+'</p><h1>'+esc(t(labels[tab]||'hrTitle'))+'</h1>'+(tab==='overview'?'<p class="sub">'+esc(t('hrSubtitle'))+'</p>':'')+'</div><div class="dept-filter"><label for="dept-filter" class="small">'+esc(t('department'))+'</label><select id="dept-filter"><option value="">'+esc(t('allDepartments'))+'</option>'+(h.departments||[]).map(d=>'<option value="'+esc(d)+'"'+(state.dept===d?' selected':'')+'>'+esc(d)+'</option>').join('')+'</select></div></div><div class="hr-body">'+body+'</div>';}
async function uploadExample(button){if(state.mutating)return;lockControls(true);button.disabled=true;button.textContent=t('uploading');try{const result=await api('api/data/upload-example',{role:'hr',method:'POST'});state.lastUpload=Array.isArray(result.added_employees)?result.added_employees:[];const message=t('uploaded',{employees:state.lastUpload.length,history:number(result.added_history)});state.hr=await api(hrUrl(),{role:'hr'});await Promise.all([loadDirectory(),loadMeta()]);lockControls(false);render();flash(message);}catch(error){lockControls(false);button.disabled=false;button.textContent=t('up_tryBtn');$('upload-status').innerHTML=alertBox(error.message,'error');}}
function openEmployee(id){state.view='employee';state.id=id;state.tab='navigator';state.navOn='top';$('view').value='employee';saveSession();fillEmployees();loadView();window.scrollTo({top:0});}
function render(){syncLabels();$('content').setAttribute('aria-busy',String(state.loading));if(state.loading){$('content').innerHTML=loading(t(state.view==='hr'?'loadHR':'loadProfile'));return;}if(state.error){$('content').innerHTML=alertBox(state.error,'error')+'<button data-action="retry">'+esc(t('retry'))+'</button>';return;}$('content').innerHTML=state.view==='hr'?(state.needHr?renderHrLogin():renderHR()):renderEmployee();if(state.fresh){state.fresh=false;$('content').classList.remove('fade-in');void $('content').offsetWidth;$('content').classList.add('fade-in');}}
function renderHrLogin(){return '<section class="panel login-panel"><h1>'+esc(t('hrLoginTitle'))+'</h1><p class="muted small">'+esc(t('hrLoginHint'))+'</p><form id="hr-login" class="chat-form"><label for="hr-password" class="visually-hidden">'+esc(t('hrPassword'))+'</label><input id="hr-password" type="password" autocomplete="current-password" placeholder="'+esc(t('hrPassword'))+'" required><button class="primary">'+esc(t('hrLoginBtn'))+'</button></form><div id="hr-login-status"></div></section>';}
async function hrLogin(pw){try{const r=await fetch('api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'hr',password:pw})});if(!r.ok){$('hr-login-status').innerHTML=alertBox(t('hrLoginWrong'),'error');return;}const d=await r.json();state.tokens=state.tokens||{};state.tokens.hr=d.token;state.needHr=false;saveSession();loadView();}catch(error){$('hr-login-status').innerHTML=alertBox(error.message,'error');}}
function lockControls(locked){state.mutating=locked;['view','employee-search','employee-select'].forEach(id=>$(id).disabled=locked);document.querySelectorAll('[data-lang]').forEach(el=>el.disabled=locked);}
async function recommend(){if(state.recommending||state.mutating||!state.profile)return;const version=state.version;const base='api/employees/'+encodeURIComponent(state.id)+'/recommend';state.recommending=true;$('flash').innerHTML='';render();try{const quick=await api(base+'?ai=false',{method:'POST',signal:state.controller.signal});if(version!==state.version)return;state.rec={...quick,upgrading:state.ai};state.hidden.clear();state.recommending=false;render();if(state.ai){const rec=await api(base+'?ai=true',{method:'POST',signal:state.controller.signal});if(version===state.version&&state.rec&&state.rec.upgrading){state.rec=rec;}}}catch(error){if(version===state.version&&error.name!=='AbortError')flash(error.message,'error');if(state.rec)state.rec.upgrading=false;}finally{if(version===state.version){state.recommending=false;render();}}}
async function complete(eventId){if(state.mutating||!state.rec?.steps?.some(s=>s.event_id===eventId))return;lockControls(true);render();let saved=false;try{const result=await api('api/employees/'+encodeURIComponent(state.id)+'/complete',{method:'POST',body:{event_id:eventId}});saved=true;state.rec=null;state.path=null;state.hidden.clear();const pts=(result.points||[]).reduce((a,x)=>a+number(x.points),0);flash(t('completion',{before:Math.round(pct(result.readiness_before)),after:Math.round(pct(result.readiness_after))})+(pts?' · '+t('pointsEarned',{n:pts}):''));state.profile=await api('api/employees/'+encodeURIComponent(state.id));loadWallet();}catch(error){if(saved){state.error=t('refreshFailed');}else flash(error.message,'error');}finally{lockControls(false);render();}}
async function upload(form){if(state.mutating)return;const data=new FormData();for(const key of ['employees','history']){const file=form.elements[key].files[0];if(file)data.append(key,file);}if(![...data.keys()].length){$('upload-status').innerHTML=alertBox(t('chooseFile'),'error');return;}lockControls(true);form.querySelectorAll('input,button').forEach(el=>el.disabled=true);const button=form.querySelector('button');button.textContent=t('uploading');let saved=false;try{const result=await api('api/data/upload',{role:'hr',method:'POST',body:data});saved=true;state.lastUpload=Array.isArray(result.added_employees)?result.added_employees:[];const message=t('uploaded',{employees:Array.isArray(result.added_employees)?result.added_employees.length:number(result.added_employees),history:number(result.added_history)});state.hr=await api(hrUrl(),{role:'hr'});await Promise.all([loadDirectory(),loadMeta()]);flash(message);lockControls(false);render();}catch(error){$('upload-status').innerHTML=alertBox(saved?t('uploadRefreshFailed'):error.message,saved?'info':'error');}finally{lockControls(false);if(form.isConnected){form.querySelectorAll('input,button').forEach(el=>el.disabled=false);button.textContent=t('upload');if(saved)form.reset();}}}
$('view').addEventListener('change',e=>{state.view=e.target.value;saveSession();loadView();});$('employee-search').addEventListener('input',fillEmployees);$('employee-select').addEventListener('change',e=>{state.id=e.target.value;saveSession();loadView();});
document.querySelectorAll('[data-lang]').forEach(el=>el.addEventListener('click',()=>{if(state.mutating)return;state.lang=el.dataset.lang;render();fillEmployees();}));
$('content').addEventListener('input',e=>{if(e.target.id==='ai-n')updateAiCost();});
$('content').addEventListener('change',e=>{if(e.target.id==='use-ai')state.ai=e.target.checked;if(e.target.id==='dept-filter'){state.dept=e.target.value;loadView();}if(e.target.id==='share-garden')toggleShare(e.target.checked);});
$('content').addEventListener('click',e=>{const button=e.target.closest('button[data-action]');if(!button||button.disabled)return;const action=button.dataset.action;if(action==='retry')loadView();if(action==='recommend')recommend();if(action==='path')loadPath();if(action==='mentors')loadMentors();if(action==='goto')goTo(button.dataset.tab);if(action==='tab'){state.tab=state.navOn=button.dataset.tab;render();if(state.tab==='path'&&!state.path)loadPath();if(state.tab==='mentors'&&!state.mentors)loadMentors();}if(action==='kudos')sendKudos(button.dataset.id);if(action==='draft'){state.hrTab='skills';loadDraft(button.dataset.id);}if(action==='hrtab'){state.hrTab=button.dataset.tab;render();window.scrollTo({top:0,behavior:'smooth'});}if(action==='upload-example')uploadExample(button);if(action==='open-emp')openEmployee(button.dataset.id);if(action==='cancel-draft'){state.draft=null;render();}if(action==='ask')ask(button.dataset.q);if(action==='challenge')walletAction('/challenge');if(action==='redeem')walletAction('/redeem',{reward_id:button.dataset.id});if(action==='complete')complete(button.dataset.id);if(action==='cancel-reason'){state.askReason=null;render();}if(action==='dismiss')dismiss(button.dataset.id,button.dataset.reason);if(action==='hide'){state.askReason=button.dataset.id;render();return;}if(false){const next=$('content').querySelector('[data-action="complete"]')||$('content').querySelector('[data-action="recommend"]');next?.focus();}});
$('content').addEventListener('submit',e=>{if(e.target.id==='upload-form'){e.preventDefault();upload(e.target);}if(e.target.id==='chat-form'){e.preventDefault();ask($('chat-input').value);}if(e.target.id==='hr-login'){e.preventDefault();hrLogin($('hr-password').value);}if(e.target.id==='draft-form'){e.preventDefault();publishDraft();}});
async function loadCatalogs(){const pub=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();});const results=await Promise.allSettled([pub('api/skills'),pub('api/events'),pub('static/i18n_names.json')]);if(results[2].status==='fulfilled')state.names=results[2].value;if(results[0].status==='fulfilled')state.skills=results[0].value;if(results[1].status==='fulfilled'&&Array.isArray(results[1].value))state.events=Object.fromEntries(results[1].value.map(e=>[e.event_id,e]));if(!state.mutating&&(state.profile||state.hr))render();}
$('sidenav').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(!b||state.mutating)return;const k=b.dataset.nav;if(state.view==='hr'){state.hrTab=k;render();window.scrollTo({top:0,behavior:'smooth'});return;}if(k==='top'){state.navOn='top';renderNav();window.scrollTo({top:0,behavior:'smooth'});return;}goTo(k);});
restoreSession();if($('view'))$('view').value=state.view;loadDirectory();loadMeta();loadView();loadCatalogs();
</script>
